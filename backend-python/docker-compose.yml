version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gex_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamma_exposure}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gamma_exposure}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gex_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-gamma_exposure}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./trained_models:/app/trained_models

volumes:
  postgres_data:
